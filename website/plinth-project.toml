[[pages.sections]]
type = "feature_grid"
id = "overview"

[[pages.sections.features]]
title = "Parse the installer as it ships"
description = "ModuleConfig.xml and info.xml deserialize into typed structs through quick-xml and serde, so a mod manager holds the wizard's steps, groups and plugins as data instead of walking raw XML. An Installer built from that config walks the wizard step by step."

[[pages.sections.features]]
title = "Evaluate conditions against state"
description = "Composite AND/OR dependency trees over file states, flags, game version and nested conditions decide which steps and plugins are visible. Group constraints such as SelectExactlyOne and SelectAtLeastOne are checked as options are chosen, and flag changes propagate to later steps."

[[pages.sections.features]]
title = "Resolve a plan, then execute it"
description = "Selections collect file operations from required files, chosen plugins and conditional file installs, sorted by priority, so the whole install is inspectable before anything is written. Executing the plan copies those files into the target directory."

[[pages.sections.features]]
title = "Declarative installs with hash checks"
description = "Skip the wizard by naming selections upfront in a declarative config with a schema version and SRI hashes in the nixpkgs rev and hash style; the library generates a defaults or all-options template to start from. The nix feature emits that config as a Nix expression or NixOS module fragment, and the cli feature builds a binary that writes it in Nix, RON or JSON."
